// ─── SUPABASE CLIENT (lightweight inline – no npm dep needed in demo) ─────────
const createSupabaseClient = (url, key) => {
  const headers = { "Content-Type": "application/json", "apikey": key, "Authorization": `Bearer ${key}` };
  const request = async (path, options = {}) => {
    const r = await fetch(`${url}${path}`, { ...options, headers: { ...headers, ...options.headers } });
    const data = await r.json().catch(() => null);
    return { data, error: r.ok ? null : data };
  };

  // Auth helpers
  const authHeaders = (token) => ({ ...headers, "Authorization": `Bearer ${token}` });

  let _session = null;
  const listeners = new Set();
  const notify = (ev, session) => { _session = session; listeners.forEach(fn => fn(ev, session)); };

  const auth = {
    getSession: async () => {
      const raw = localStorage.getItem("etj_session");
      if (!raw) return { data: { session: null } };
      try {
        const session = JSON.parse(raw);
        if (session.expires_at && Date.now() / 1000 > session.expires_at) {
          localStorage.removeItem("etj_session");
          return { data: { session: null } };
        }
        _session = session;
        return { data: { session } };
      } catch { return { data: { session: null } }; }
    },
    signUp: async ({ email, password, options }) => {
      const r = await request("/auth/v1/signup", {
        method: "POST",
        body: JSON.stringify({ email, password, data: options?.data || {} }),
      });
      if (!r.error && r.data?.user) {
        const session = { ...r.data, expires_at: Math.floor(Date.now() / 1000) + 3600 };
        localStorage.setItem("etj_session", JSON.stringify(session));
        notify("SIGNED_IN", session);
      }
      return r;
    },
    signInWithPassword: async ({ email, password }) => {
      const r = await request("/auth/v1/token?grant_type=password", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });
      if (!r.error && r.data?.access_token) {
        const session = { ...r.data, expires_at: Math.floor(Date.now() / 1000) + (r.data.expires_in || 3600) };
        localStorage.setItem("etj_session", JSON.stringify(session));
        notify("SIGNED_IN", session);
      }
      return r;
    },
    signOut: async () => {
      const session = _session;
      localStorage.removeItem("etj_session");
      notify("SIGNED_OUT", null);
      if (session?.access_token) {
        await request("/auth/v1/logout", { method: "POST", headers: authHeaders(session.access_token) });
      }
      return { error: null };
    },
    resetPasswordForEmail: async (email, options) => {
      return request("/auth/v1/recover", { method: "POST", body: JSON.stringify({ email, ...options }) });
    },
    onAuthStateChange: (fn) => { listeners.add(fn); return { data: { subscription: { unsubscribe: () => listeners.delete(fn) } } }; },
    getUser: () => ({ data: { user: _session?.user || null } }),
  };

  // Database helpers
  const from = (table) => {
    const state = { _table: table, _select: "*", _filters: [], _order: null, _limit: null, _range: null };
    const chain = {
      select: (cols = "*") => { state._select = cols; return chain; },
      eq: (col, val) => { state._filters.push({ type: "eq", col, val }); return chain; },
      neq: (col, val) => { state._filters.push({ type: "neq", col, val }); return chain; },
      ilike: (col, val) => { state._filters.push({ type: "ilike", col, val }); return chain; },
      in: (col, vals) => { state._filters.push({ type: "in", col, vals }); return chain; },
      order: (col, opts = {}) => { state._order = { col, ...opts }; return chain; },
      limit: (n) => { state._limit = n; return chain; },
      range: (from, to) => { state._range = { from, to }; return chain; },
      single: () => { state._single = true; return chain; },

      _buildUrl: () => {
        let qs = `select=${encodeURIComponent(state._select)}`;
        state._filters.forEach(f => {
          if (f.type === "eq")    qs += `&${f.col}=eq.${encodeURIComponent(f.val)}`;
          if (f.type === "neq")   qs += `&${f.col}=neq.${encodeURIComponent(f.val)}`;
          if (f.type === "ilike") qs += `&${f.col}=ilike.${encodeURIComponent(f.val)}`;
          if (f.type === "in")    qs += `&${f.col}=in.(${f.vals.map(encodeURIComponent).join(",")})`;
        });
        if (state._order) qs += `&order=${state._order.col}.${state._order.ascending === false ? "desc" : "asc"}`;
        if (state._limit) qs += `&limit=${state._limit}`;
        return `/rest/v1/${state._table}?${qs}`;
      },

      then: (resolve) => {
        const session = _session;
        const h = session?.access_token ? authHeaders(session.access_token) : headers;
        const rangeHeaders = state._range ? { "Range": `${state._range.from}-${state._range.to}`, "Prefer": "count=exact" } : {};
        fetch(`${url}${chain._buildUrl()}`, { headers: { ...h, ...rangeHeaders } })
          .then(r => {
            const count = r.headers.get("Content-Range")?.split("/")[1];
            return r.json().then(data => {
              const result = r.ok
                ? { data: state._single ? (Array.isArray(data) ? data[0] : data) : data, error: null, count: count ? parseInt(count) : null }
                : { data: null, error: data };
              resolve(result);
            });
          })
          .catch(err => resolve({ data: null, error: err }));
        return { catch: () => {} };
      },

      insert: async (rows, opts = {}) => {
        const session = _session;
        const h = session?.access_token ? authHeaders(session.access_token) : headers;
        const prefer = opts.returning === false ? "return=minimal" : "return=representation";
        const r = await fetch(`${url}/rest/v1/${state._table}`, {
          method: "POST",
          headers: { ...h, "Prefer": prefer },
          body: JSON.stringify(rows),
        });
        const data = await r.json().catch(() => null);
        return r.ok ? { data, error: null } : { data: null, error: data };
      },

      update: async (updates) => {
        const session = _session;
        const h = session?.access_token ? authHeaders(session.access_token) : headers;
        const qs = state._filters.map(f => f.type === "eq" ? `${f.col}=eq.${encodeURIComponent(f.val)}` : "").join("&");
        const r = await fetch(`${url}/rest/v1/${state._table}?${qs}`, {
          method: "PATCH",
          headers: { ...h, "Prefer": "return=representation" },
          body: JSON.stringify(updates),
        });
        const data = await r.json().catch(() => null);
        return r.ok ? { data, error: null } : { data: null, error: data };
      },

      delete: async () => {
        const session = _session;
        const h = session?.access_token ? authHeaders(session.access_token) : headers;
        const qs = state._filters.map(f => f.type === "eq" ? `${f.col}=eq.${encodeURIComponent(f.val)}` : "").join("&");
        const r = await fetch(`${url}/rest/v1/${state._table}?${qs}`, {
          method: "DELETE",
          headers: { ...h, "Prefer": "return=minimal" },
        });
        return r.ok ? { error: null } : { error: await r.json().catch(() => null) };
      },
    };
    return chain;
  };

  // Realtime (simplified polling for demo)
  const channel = (name) => ({
    on: (event, filter, fn) => ({ subscribe: () => ({ unsubscribe: () => {} }) }),
    subscribe: () => {},
  });

  return { auth, from, channel };
};

const timeAgo = (ts) => {
  const diff = (Date.now() - new Date(ts)) / 1000;
  if (diff < 60)   return "just now";
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400)return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
};
const sanitize = (str) => String(str).replace(/[<>'"&]/g, c => ({ "<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;","&":"&amp;" }[c]));
const validateEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const validatePassword = (p) => p.length >= 8 && /[A-Z]/.test(p) && /[0-9]/.test(p);

// ─── CUSTOM HOOKS ─────────────────────────────────────────────────────────────
function useLocalStorage(key, initial) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  const set = useCallback(v => {
    const next = typeof v === "function" ? v(val) : v;
    setVal(next);
    try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
  }, [key, val]);
  return [val, set];
}

function useDebounce(val, delay = 300) {
  const [deb, setDeb] = useState(val);
  useEffect(() => { const t = setTimeout(() => setDeb(val), delay); return () => clearTimeout(t); }, [val, delay]);
  return deb;
}

function usePagination(items, perPage = 6) {
  const [page, setPage] = useState(1);
  const total = Math.ceil(items.length / perPage);
  const slice = useMemo(() => items.slice((page-1)*perPage, page*perPage), [items, page, perPage]);
  return { slice, page, total, setPage, hasNext: page < total, hasPrev: page > 1 };
}

// ─── TOAST NOTIFICATIONS ──────────────────────────────────────────────────────
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((message, type = "success") => {
    const id = Date.now();
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000);
  }, []);
  const colors = { success: T.green, error: T.red, info: T.navyMid, warning: T.gold };
  return (
    <ToastCtx.Provider value={{ show }}>
      {children}
      <div style={{ position:"fixed", bottom:24, right:24, zIndex:9999, display:"flex", flexDirection:"column", gap:8, pointerEvents:"none" }}>
        {toasts.map(t => (
          <div key={t.id} style={{
            background: colors[t.type] || T.navyMid, color:"#fff",
            borderRadius: T.r12, padding: "12px 18px", fontSize: 14, fontWeight: 600,
            boxShadow: T.shadowModal, maxWidth: 340, animation: "slideIn 0.3s ease",
            display:"flex", alignItems:"center", gap:10,
          }}>
            <span>{t.type==="success"?"✓":t.type==="error"?"✕":t.type==="warning"?"⚠":"ℹ"}</span>
            {t.message}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

// ─── AUTH MODAL ───────────────────────────────────────────────────────────────
function AuthModal({ mode: initMode = "login", onClose, onAuth }) {
  const [mode, setMode]     = useState(initMode);
  const [role, setRole]     = useState("seeker");
  const [form, setForm]     = useState({ name:"", email:"", password:"", confirm:"" });
  const [loading, setLoading] = useState(false);
  const [error, setError]   = useState("");
  const [success, setSuccess] = useState("");
  const { show } = useToast();
  const set = k => e => setForm(f => ({ ...f, [k]: sanitize(e.target.value) }));

  const handleSubmit = async () => {
    setError(""); setSuccess("");
    if (mode === "forgot") {
      if (!validateEmail(form.email)) return setError("Enter a valid email address.");
      setLoading(true);
      const { error } = await supabase.auth.resetPasswordForEmail(form.email, { redirectTo: `${window.location.origin}/reset` });
      setLoading(false);
      if (error) return setError(error.message);
      return setSuccess("Check your email for a password reset link.");
    }
    if (mode === "register") {
      if (!form.name.trim())           return setError("Full name is required.");
      if (!validateEmail(form.email))  return setError("Enter a valid email address.");
      if (!validatePassword(form.password)) return setError("Password needs 8+ chars, one uppercase letter, and one number.");
      if (form.password !== form.confirm) return setError("Passwords do not match.");
      setLoading(true);
      const { data, error } = await supabase.auth.signUp({
        email: form.email,
        password: form.password,
        options: { data: { full_name: form.name, role } },
      });
      setLoading(false);
      if (error) return setError(error.message);
      // DEMO fallback: simulate success
      const user = data?.user || { id: Date.now().toString(), email: form.email, user_metadata: { full_name: form.name, role } };
      show("Account created! Welcome to EthioJobs Connect.", "success");
      onAuth({ id: user.id, name: form.name, email: form.email, role });
      onClose();
      return;
    }
    // Login
    if (!validateEmail(form.email)) return setError("Enter a valid email address.");
    if (!form.password)             return setError("Password is required.");
    setLoading(true);
    const { data, error } = await supabase.auth.signInWithPassword({ email: form.email, password: form.password });
    setLoading(false);
    if (error) {
      // DEMO fallback: allow demo login
      if (form.email.includes("demo") || form.email.includes("test")) {
        const demoRole = form.email.includes("admin") ? "admin" : form.email.includes("employer") ? "employer" : "seeker";
        onAuth({ id:"demo-"+demoRole, name:demoRole==="admin"?"Admin User":demoRole==="employer"?"Employer Demo":"Abebe Birru", email:form.email, role:demoRole });
        show("Signed in (demo mode)", "info");
        onClose();
        return;
      }
      return setError(error.message || "Invalid credentials. Try a demo account: seeker@demo.com");
    }
    const user = data.user;
    const profile = { id: user.id, name: user.user_metadata?.full_name || "User", email: user.email, role: user.user_metadata?.role || "seeker" };
    onAuth(profile);
    show("Welcome back!", "success");
    onClose();
  };

  const inp = { width:"100%", padding:"11px 14px", borderRadius:T.r10, border:`1.5px solid ${T.grayLight}`, fontSize:14, outline:"none", boxSizing:"border-box", fontFamily:T.fontSans, transition:"border-color 0.2s" };
  const lbl = { fontSize:13, fontWeight:600, color:T.navy, marginBottom:5, display:"block" };

  return (
    <Modal onClose={onClose} maxWidth={430} title={mode==="login"?"Welcome back":mode==="register"?"Create account":"Reset password"}>
      <div style={{ padding:24 }}>
        {mode !== "forgot" && (
          <>
            <button style={{ width:"100%", padding:"11px", border:`1.5px solid ${T.grayLight}`, borderRadius:T.r10, background:"#fff", display:"flex", alignItems:"center", justifyContent:"center", gap:10, cursor:"pointer", fontSize:14, fontWeight:600, color:T.navy, marginBottom:16 }}>
              <span style={{ fontWeight:800, fontSize:16, color:"#4285F4" }}>G</span> Continue with Google
            </button>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:16 }}>
              <div style={{ flex:1, height:1, background:T.grayLight }}/><span style={{ fontSize:12, color:T.gray }}>or</span><div style={{ flex:1, height:1, background:T.grayLight }}/>
            </div>
          </>
        )}
        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
          {mode==="register" && (
            <>
              <div><label style={lbl}>Full Name</label><input style={inp} placeholder="Abebe Birru" value={form.name} onChange={set("name")}/></div>
              <div>
                <label style={lbl}>I am a</label>
                <div style={{ display:"flex", gap:8 }}>
                  {[["seeker","👤 Job Seeker"],["employer","🏢 Employer"]].map(([r,l])=>(
                    <button key={r} onClick={()=>setRole(r)} style={{ flex:1, padding:"10px", borderRadius:T.r10, border:`2px solid ${role===r?T.green:T.grayLight}`, background:role===r?T.greenLight:"#fff", color:role===r?T.green:T.navy, fontWeight:700, cursor:"pointer", fontSize:13, transition:"all 0.2s" }}>{l}</button>
                  ))}
                </div>
              </div>
            </>
          )}
          <div><label style={lbl}>Email</label><input style={inp} type="email" placeholder="you@example.com" value={form.email} onChange={set("email")}/></div>
          {mode!=="forgot" && <div><label style={lbl}>Password</label><input style={inp} type="password" placeholder={mode==="register"?"Min. 8 chars, 1 uppercase, 1 number":"••••••••"} value={form.password} onChange={set("password")}/></div>}
          {mode==="register" && <div><label style={lbl}>Confirm Password</label><input style={inp} type="password" placeholder="Repeat password" value={form.confirm} onChange={set("confirm")}/></div>}
        </div>
        {error   && <div style={{ background:T.redLight, color:T.red, borderRadius:T.r8, padding:"10px 14px", fontSize:13, marginTop:14, fontWeight:500 }}>⚠ {error}</div>}
        {success && <div style={{ background:T.greenLight, color:T.greenDark, borderRadius:T.r8, padding:"10px 14px", fontSize:13, marginTop:14, fontWeight:500 }}>✓ {success}</div>}
        <button onClick={handleSubmit} disabled={loading} style={{ width:"100%", padding:"13px", borderRadius:T.r10, background:`linear-gradient(135deg,${T.green},${T.greenDark})`, color:"#fff", border:"none", fontWeight:800, fontSize:15, cursor:loading?"not-allowed":"pointer", marginTop:16, display:"flex", alignItems:"center", justifyContent:"center", gap:10, opacity:loading?0.8:1 }}>
          {loading ? <><Spinner size={16} color="#fff"/> Processing…</> : mode==="login"?"Sign in →":mode==="register"?"Create account →":"Send reset link"}
        </button>
        <div style={{ marginTop:16, textAlign:"center", fontSize:13, color:T.gray, lineHeight:1.7 }}>
          {mode==="login" && <><span>No account? </span><button onClick={()=>setMode("register")} style={{ background:"none", border:"none", color:T.green, fontWeight:700, cursor:"pointer" }}>Create one</button><br/><button onClick={()=>setMode("forgot")} style={{ background:"none", border:"none", color:T.gray, cursor:"pointer", fontSize:12 }}>Forgot password?</button></>}
          {mode==="register" && <><span>Already have an account? </span><button onClick={()=>setMode("login")} style={{ background:"none", border:"none", color:T.green, fontWeight:700, cursor:"pointer" }}>Sign in</button></>}
          {mode==="forgot" && <button onClick={()=>setMode("login")} style={{ background:"none", border:"none", color:T.green, fontWeight:700, cursor:"pointer" }}>← Back to sign in</button>}
        </div>
        <div style={{ marginTop:16, padding:"10px 14px", background:T.yellowLight, borderRadius:T.r8, fontSize:12, color:T.gold }}>
          <strong>Demo accounts:</strong> seeker@demo.com / employer@demo.com / admin@demo.com (any password)
        </div>
      </div>
    </Modal>
  );
}

      cv_url: form.cvUrl, linkedin_url: form.linkedin, status: "Pending",

// ─── AI CHAT ASSISTANT ────────────────────────────────────────────────────────
function AIChat({ onClose, user }) {
  const [messages, setMessages] = useLocalStorage("etj_ai_chat", [
    { role:"assistant", content:"👋 Hi! I'm EthioJobs AI. I can help with job search, CV tips, interview prep, salary negotiation, and career advice for the Ethiopian market. What would you like help with today?" }
  ]);
  const [input, setInput]   = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);
  const { show } = useToast();

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:"smooth" }); }, [messages]);

  const send = async () => {
    const text = input.trim();
    if (!text || loading) return;
    setInput("");
    const userMsg = { role:"user", content: sanitize(text) };
    setMessages(m => [...m, userMsg]);
    setLoading(true);
    try {
      const history = [...messages, userMsg].slice(-10).map(m => ({ role:m.role, content:m.content }));
      const reply = await callAI(history,
        `You are EthioJobs AI Assistant, a career expert specializing in the Ethiopian job market. You help with: job searching, CV writing, interview preparation, salary negotiation, career development, and professional growth for Ethiopian professionals. Be concise, encouraging, and specific to the Ethiopian context. ${user ? `User's name: ${user.name}.` : ""}`,
        600
      );
      setMessages(m => [...m, { role:"assistant", content:reply }]);
    } catch (err) {
      show("AI unavailable. Please try again.", "error");
      setMessages(m => [...m, { role:"assistant", content:"I'm temporarily unavailable. Please try again in a moment." }]);
    }
    setLoading(false);
  };

  const suggestions = ["Help me improve my CV", "How to prepare for interviews?", "Salary negotiation tips", "Best jobs in tech in Ethiopia"];

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(10,22,40,0.6)", zIndex:3000, display:"flex", alignItems:"flex-end", justifyContent:"flex-end", padding:24 }}>
      <div style={{ width:"100%", maxWidth:420, height:580, background:"#fff", borderRadius:T.r20, boxShadow:T.shadowModal, display:"flex", flexDirection:"column", overflow:"hidden" }}>
        {/* Header */}
        <div style={{ background:`linear-gradient(135deg,${T.navy},${T.navyMid})`, padding:"14px 18px", display:"flex", alignItems:"center", gap:12 }}>
          <div style={{ width:36, height:36, borderRadius:"50%", background:`linear-gradient(135deg,${T.green},${T.yellow})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18 }}>✦</div>
          <div><div style={{ color:"#fff", fontWeight:800, fontSize:15 }}>EthioJobs AI</div><div style={{ color:T.green, fontSize:11 }}>Career Assistant</div></div>
          <button onClick={()=>{ if(window.confirm("Clear chat history?")) setMessages([]); }} style={{ marginLeft:"auto", background:"rgba(255,255,255,0.1)", border:"none", color:"rgba(255,255,255,0.6)", borderRadius:T.r8, padding:"5px 10px", cursor:"pointer", fontSize:12 }}>Clear</button>
          <button onClick={onClose} style={{ background:"rgba(255,255,255,0.15)", border:"none", color:"#fff", width:28, height:28, borderRadius:T.r8, cursor:"pointer" }}>✕</button>
        </div>

        {/* Messages */}
        <div style={{ flex:1, overflowY:"auto", padding:16, display:"flex", flexDirection:"column", gap:12 }}>
          {messages.map((m, i) => (
            <div key={i} style={{ display:"flex", justifyContent:m.role==="user"?"flex-end":"flex-start" }}>
              <div style={{
                maxWidth:"80%", padding:"10px 14px", borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",
                background:m.role==="user"?`linear-gradient(135deg,${T.green},${T.greenDark})`:"#F4F7FB",
                color:m.role==="user"?"#fff":T.navy, fontSize:13, lineHeight:1.6,
              }}>{m.content}</div>
            </div>
          ))}
          {loading && (
            <div style={{ display:"flex", justifyContent:"flex-start" }}>
              <div style={{ background:"#F4F7FB", borderRadius:"18px 18px 18px 4px", padding:"12px 16px" }}>
                <div style={{ display:"flex", gap:4 }}>
                  {[0,1,2].map(i=><div key={i} style={{ width:6, height:6, borderRadius:"50%", background:T.gray, animation:`bounce 1.2s ${i*0.2}s infinite` }}/>)}
                </div>
              </div>
            </div>
          )}
          <div ref={bottomRef}/>
        </div>

        {/* Quick suggestions */}
        {messages.length <= 1 && (
          <div style={{ padding:"0 12px 8px", display:"flex", flexWrap:"wrap", gap:6 }}>
            {suggestions.map(s => (
              <button key={s} onClick={()=>{ setInput(s); setTimeout(()=>document.getElementById("ai-input")?.focus(),100); }}
                style={{ background:T.greenLight, color:T.green, border:"none", borderRadius:20, padding:"5px 12px", fontSize:12, fontWeight:600, cursor:"pointer" }}>{s}</button>
            ))}
          </div>
        )}

        {/* Input */}
        <div style={{ padding:"12px 14px", borderTop:`1px solid ${T.grayLight}`, display:"flex", gap:8 }}>
          <input id="ai-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()}
            placeholder="Ask anything about your career…"
            style={{ flex:1, padding:"10px 14px", borderRadius:T.r10, border:`1.5px solid ${T.grayLight}`, fontSize:13, outline:"none", fontFamily:T.fontSans }}/>
          <button onClick={send} disabled={loading||!input.trim()}
            style={{ background:T.green, color:"#fff", border:"none", borderRadius:T.r10, padding:"0 16px", cursor:"pointer", fontWeight:700, fontSize:18, opacity:(!input.trim()||loading)?0.5:1 }}>→</button>
        </div>
      </div>
    </div>
  );
}

          <div style={{ background:surface, borderRadius:T.r16, padding:"20px 22px", border:`1px solid ${border}`, gridColumn:"1/-1" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
              <div style={{ fontWeight:700, fontSize:15 }}>Professional Summary</div>
              <button onClick={()=>improveAI("summary")} disabled={aiLoading} style={{ background:T.greenLight, color:T.green, border:"none", borderRadius:T.r8, padding:"5px 12px", cursor:"pointer", fontSize:12, fontWeight:700, display:"flex", alignItems:"center", gap:6 }}>
                {aiLoading?<Spinner size={12}/>:"✦"} AI Improve
              </button>
            </div>
            <textarea style={ta} value={cv.summary||""} onChange={e=>setCv(c=>({...c,summary:e.target.value}))} placeholder="Write a compelling professional summary…"/>

              </div>

          </div>

          {/* Experience */}
          <div style={{ background:surface, borderRadius:T.r16, padding:"20px 22px", border:`1px solid ${border}`, gridColumn:"1/-1" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={{ fontWeight:700, fontSize:15 }}>Experience</div>
              <button onClick={()=>setCv(c=>({...c,experience:[...c.experience,{company:"",role:"",period:"",bullets:[""]}]}))}
                style={{ background:T.greenLight, color:T.green, border:"none", borderRadius:T.r8, padding:"5px 12px", cursor:"pointer", fontSize:13, fontWeight:700 }}>+ Add</button>
            </div>
            {cv.experience.map((exp,i)=>(
              <div key={i} style={{ background:darkMode?T.navy:"#F8FAFF", borderRadius:T.r12, padding:14, marginBottom:12, border:`1px solid ${border}` }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input style={inp} placeholder="Company" value={exp.company} onChange={e=>setCv(c=>{ const ex=[...c.experience]; ex[i]={...ex[i],company:e.target.value}; return {...c,experience:ex}; })}/>
                  <input style={inp} placeholder="Job Title" value={exp.role} onChange={e=>setCv(c=>{ const ex=[...c.experience]; ex[i]={...ex[i],role:e.target.value}; return {...c,experience:ex}; })}/>
                  <input style={{...inp,gridColumn:"1/-1"}} placeholder="Period (2021–Present)" value={exp.period} onChange={e=>setCv(c=>{ const ex=[...c.experience]; ex[i]={...ex[i],period:e.target.value}; return {...c,experience:ex}; })}/>
                </div>
                {exp.bullets.map((b,j)=>(
                  <div key={j} style={{ display:"flex", gap:6, marginBottom:6 }}>
                    <input style={{...inp,flex:1}} placeholder={`Achievement ${j+1}`} value={b} onChange={e=>setCv(c=>{ const ex=[...c.experience]; ex[i]={...ex[i],bullets:ex[i].bullets.map((x,k)=>k===j?e.target.value:x)}; return {...c,experience:ex}; })}/>
                    <button onClick={()=>setCv(c=>{ const ex=[...c.experience]; ex[i]={...ex[i],bullets:ex[i].bullets.filter((_,k)=>k!==j)}; return {...c,experience:ex}; })} style={{ background:"none", border:`1px solid ${border}`, borderRadius:T.r8, padding:"0 10px", cursor:"pointer", color:T.red }}>×</button>
                  </div>
                ))}
                <div style={{ display:"flex", gap:8, marginTop:4 }}>
                  <button onClick={()=>setCv(c=>{ const ex=[...c.experience]; ex[i]={...ex[i],bullets:[...ex[i].bullets,""]}; return {...c,experience:ex}; })} style={{ background:"none", border:`1px dashed ${border}`, borderRadius:T.r8, padding:"5px 12px", cursor:"pointer", color:textSec, fontSize:12 }}>+ Add bullet</button>
                  <button onClick={()=>setCv(c=>({...c,experience:c.experience.filter((_,k)=>k!==i)}))} style={{ background:"none", border:`1px solid ${T.red}44`, borderRadius:T.r8, padding:"5px 12px", cursor:"pointer", color:T.red, fontSize:12 }}>Remove</button>
                </div>
              </div>
            ))}
          </div>

          {/* Skills */}
          <div style={{ background:surface, borderRadius:T.r16, padding:"20px 22px", border:`1px solid ${border}` }}>
            <div style={{ fontWeight:700, fontSize:15, marginBottom:10 }}>Skills</div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
              {cv.skills.map((s,i)=>(
                <span key={i} style={{ background:T.greenLight, color:T.green, borderRadius:20, padding:"4px 12px", fontSize:13, fontWeight:600, display:"flex", alignItems:"center", gap:6 }}>
                  {s}<button onClick={()=>setCv(c=>({...c,skills:c.skills.filter((_,k)=>k!==i)}))} style={{ background:"none", border:"none", color:T.green, cursor:"pointer", fontSize:14, padding:0, lineHeight:1 }}>×</button>
                </span>
              ))}
            </div>
            <input style={inp} placeholder="Type a skill, press Enter" onKeyDown={e=>{ if(e.key==="Enter"&&e.target.value.trim()){ setCv(c=>({...c,skills:[...c.skills,e.target.value.trim()]})); e.target.value=""; }}}/>
          </div>

          {/* Languages & Education */}
          <div style={{ background:surface, borderRadius:T.r16, padding:"20px 22px", border:`1px solid ${border}` }}>
            <div style={{ fontWeight:700, fontSize:15, marginBottom:10 }}>Languages</div>
            {cv.languages.map((l,i)=>(
              <div key={i} style={{ display:"flex", gap:6, marginBottom:6 }}>
                <input style={{...inp,flex:1}} value={l} onChange={e=>setCv(c=>({...c,languages:c.languages.map((x,k)=>k===i?e.target.value:x)}))}/>
                <button onClick={()=>setCv(c=>({...c,languages:c.languages.filter((_,k)=>k!==i)}))} style={{ background:"none", border:`1px solid ${border}`, borderRadius:T.r8, padding:"0 10px", cursor:"pointer", color:T.red }}>×</button>
              </div>
            ))}
            <button onClick={()=>setCv(c=>({...c,languages:[...c.languages,""]}))} style={{ background:"none", border:`1px dashed ${border}`, borderRadius:T.r8, padding:"5px 12px", cursor:"pointer", color:textSec, fontSize:12 }}>+ Add language</button>
            <div style={{ fontWeight:700, fontSize:15, marginTop:16, marginBottom:10 }}>Education</div>
            {cv.education.map((e,i)=>(
              <div key={i} style={{ marginBottom:8 }}>
                <input style={{...inp,marginBottom:6}} placeholder="Degree / Certificate" value={e.degree} onChange={ev=>setCv(c=>{ const ed=[...c.education]; ed[i]={...ed[i],degree:ev.target.value}; return {...c,education:ed}; })}/>
                <div style={{ display:"grid", gridTemplateColumns:"1fr auto", gap:6 }}>
                  <input style={inp} placeholder="University / Institution" value={e.school} onChange={ev=>setCv(c=>{ const ed=[...c.education]; ed[i]={...ed[i],school:ev.target.value}; return {...c,education:ed}; })}/>
                  <input style={{...inp,width:70}} placeholder="Year" value={e.year} onChange={ev=>setCv(c=>{ const ed=[...c.education]; ed[i]={...ed[i],year:ev.target.value}; return {...c,education:ed}; })}/>
                </div>
              </div>
            ))}
            <button onClick={()=>setCv(c=>({...c,education:[...c.education,{degree:"",school:"",year:""}]}))} style={{ background:"none", border:`1px dashed ${border}`, borderRadius:T.r8, padding:"5px 12px", cursor:"pointer", color:textSec, fontSize:12, marginTop:4 }}>+ Add education</button>
          </div>
        </div>
      )}

      {/* PREVIEW */}
      {tab==="preview" && (
        <div style={{ background:"#fff", borderRadius:T.r16, overflow:"hidden", boxShadow:T.shadow, border:`1px solid ${border}` }}>
          <div style={{ background:accent, color:"#fff", padding:"28px 32px" }}>
            <div style={{ fontSize:26, fontWeight:800, marginBottom:4 }}>{cv.name}</div>
            <div style={{ fontSize:15, opacity:0.85, marginBottom:10 }}>{cv.title}</div>
            <div style={{ display:"flex", gap:16, fontSize:12, opacity:0.8, flexWrap:"wrap" }}>
              <span>✉ {cv.email}</span><span>📞 {cv.phone}</span><span>📍 {cv.location}</span>
              {cv.linkedin&&<span>🔗 {cv.linkedin}</span>}
            </div>
          </div>
          <div style={{ padding:"24px 32px" }}>
            {cv.summary&&<><div style={{ fontSize:11, fontWeight:800, textTransform:"uppercase", letterSpacing:2, color:accent, borderBottom:`2px solid ${accent}`, paddingBottom:4, marginBottom:10, marginTop:8 }}>Professional Summary</div><p style={{ fontSize:13, color:"#333", lineHeight:1.8, margin:"0 0 8px" }}>{cv.summary}</p></>}
            <div style={{ fontSize:11, fontWeight:800, textTransform:"uppercase", letterSpacing:2, color:accent, borderBottom:`2px solid ${accent}`, paddingBottom:4, marginBottom:10, marginTop:20 }}>Experience</div>
            {cv.experience.map((e,i)=>(
              <div key={i} style={{ marginBottom:16 }}>
                <div style={{ display:"flex", justifyContent:"space-between" }}><span style={{ fontWeight:700, fontSize:14 }}>{e.role}</span><span style={{ fontSize:12, color:"#666" }}>{e.period}</span></div>
                <div style={{ fontSize:13, color:"#555", margin:"2px 0 6px" }}>{e.company}</div>
                <ul style={{ margin:0, paddingLeft:18 }}>{e.bullets.map((b,j)=><li key={j} style={{ fontSize:13, color:"#333", marginBottom:3, lineHeight:1.5 }}>{b}</li>)}</ul>
              </div>
            ))}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:24, marginTop:16 }}>
              <div>
                <div style={{ fontSize:11, fontWeight:800, textTransform:"uppercase", letterSpacing:2, color:accent, borderBottom:`2px solid ${accent}`, paddingBottom:4, marginBottom:8 }}>Education</div>
                {cv.education.map((e,i)=><div key={i} style={{ marginBottom:10 }}><div style={{ fontWeight:700, fontSize:13 }}>{e.degree}</div><div style={{ fontSize:12, color:"#555" }}>{e.school}</div><div style={{ fontSize:11, color:"#888" }}>{e.year}</div></div>)}
                <div style={{ fontSize:11, fontWeight:800, textTransform:"uppercase", letterSpacing:2, color:accent, borderBottom:`2px solid ${accent}`, paddingBottom:4, marginBottom:8, marginTop:16 }}>Languages</div>
                <ul style={{ margin:0, paddingLeft:18 }}>{cv.languages.map((l,i)=><li key={i} style={{ fontSize:13, color:"#333", marginBottom:2 }}>{l}</li>)}</ul>
              </div>
              <div>
                <div style={{ fontSize:11, fontWeight:800, textTransform:"uppercase", letterSpacing:2, color:accent, borderBottom:`2px solid ${accent}`, paddingBottom:4, marginBottom:8 }}>Skills</div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{cv.skills.map((s,i)=><span key={i} style={{ background:accent+"18", color:accent, borderRadius:20, padding:"4px 12px", fontSize:12, fontWeight:600 }}>{s}</span>)}</div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* AI TOOLS */}
      {tab==="ai" && (
        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          {/* ATS Score */}
          <div style={{ background:surface, borderRadius:T.r16, padding:"20px 22px", border:`1px solid ${border}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div>
                <div style={{ fontWeight:700, fontSize:15 }}>ATS Score Analyzer</div>
                <div style={{ fontSize:13, color:textSec }}>See how your CV performs against Applicant Tracking Systems</div>
              </div>
              <button onClick={runATS} disabled={aiLoading} style={{ background:`linear-gradient(135deg,${T.green},${T.greenDark})`, color:"#fff", border:"none", borderRadius:T.r10, padding:"9px 18px", cursor:"pointer", fontWeight:700, fontSize:13, display:"flex", alignItems:"center", gap:8 }}>
                {aiLoading?<><Spinner size={14} color="#fff"/>Analyzing…</>:"✦ Analyze CV"}
              </button>
            </div>
            {atsResult && (
              <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                <div style={{ display:"flex", alignItems:"center", gap:20, flexWrap:"wrap" }}>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontSize:48, fontWeight:900, color:atsResult.score>=70?T.green:atsResult.score>=50?T.gold:T.red, lineHeight:1 }}>{atsResult.score}</div>
                    <div style={{ fontSize:12, color:textSec }}>ATS Score</div>
                    <div style={{ fontSize:20, fontWeight:800, color:T.navy }}>{atsResult.grade}</div>
                  </div>
                  <div style={{ flex:1, minWidth:200 }}>
                    <ProgressBar value={atsResult.score} color={atsResult.score>=70?T.green:atsResult.score>=50?T.gold:T.red}/>
                    <div style={{ fontSize:12, color:textSec, marginTop:6 }}>{atsResult.score>=70?"Strong ATS performance":atsResult.score>=50?"Moderate — needs improvement":"Low ATS score — significant improvements needed"}</div>
                  </div>
                </div>
                {atsResult.strengths?.length>0&&<div><div style={{ fontWeight:700, fontSize:13, color:T.green, marginBottom:6 }}>✓ Strengths</div>{atsResult.strengths.map((s,i)=><div key={i} style={{ fontSize:13, color:textSec, marginBottom:3 }}>• {s}</div>)}</div>}
                {atsResult.improvements?.length>0&&<div><div style={{ fontWeight:700, fontSize:13, color:T.gold, marginBottom:6 }}>⚠ Improvements</div>{atsResult.improvements.map((s,i)=><div key={i} style={{ fontSize:13, color:textSec, marginBottom:3 }}>• {s}</div>)}</div>}
                {atsResult.keywords_missing?.length>0&&<div><div style={{ fontWeight:700, fontSize:13, color:T.red, marginBottom:6 }}>✗ Missing Keywords</div><div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{atsResult.keywords_missing.map((k,i)=><Badge key={i} label={k} color={T.red} bg={T.redLight}/>)}</div></div>}
              </div>
            )}
          </div>

          {/* AI Tools Grid */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))", gap:12 }}>
            {[
              { icon:"✉️", title:"Cover Letter Generator", desc:"Generate a tailored cover letter for any job posting", action:"cover_letter" },
              { icon:"🎤", title:"Interview Prep", desc:"Practice with AI-generated role-specific interview questions", action:"interview" },
              { icon:"📈", title:"Career Path Advisor", desc:"Get personalized career progression recommendations", action:"career" },
              { icon:"🔧", title:"Skill Gap Analyzer", desc:"Discover which skills to learn for your target role", action:"skills" },
              { icon:"💰", title:"Salary Negotiation Coach", desc:"Learn how to negotiate your salary confidently", action:"salary" },
              { icon:"🌍", title:"Job Market Insights", desc:"Ethiopia job market trends and in-demand skills", action:"market" },
            ].map(tool=>(
              <div key={tool.action} style={{ background:surface, borderRadius:T.r16, padding:"18px 20px", border:`1px solid ${border}`, cursor:"pointer", transition:"all 0.2s" }}
                onClick={async ()=>{
                  setAiLoading(true);
                  try {
                    const prompts = {
                      cover_letter:`Write a professional cover letter template for ${cv.title} roles in Ethiopia. Use the candidate's background: ${cv.summary?.slice(0,200)}`,
                      interview:`Generate 5 challenging interview questions with ideal answers for a ${cv.title} role in Ethiopia. Format with Q: and A: labels.`,
                      career:`Based on this profile - Title: ${cv.title}, Skills: ${cv.skills.slice(0,6).join(", ")} - give a 3-step career progression plan for the Ethiopian market.`,
                      skills:`For a ${cv.title} with these skills: ${cv.skills.join(", ")}, identify the top 5 skills gaps and learning resources available in Ethiopia/online.`,
                      salary:`What is the typical salary range for a ${cv.title} in Ethiopia (Addis Ababa)? Give negotiation tips and market context.`,
                      market:`What are the top 5 in-demand job sectors and skills in Ethiopia in 2024? Any specific advice for ${cv.title} roles?`,
                    };
                    const reply = await callAI([{role:"user",content:prompts[tool.action]}],"You are a career expert for the Ethiopian job market. Be specific, practical, and concise.");
                    setAiSuggestion(reply);
                    setTab("ai");
                  } catch { setAiSuggestion("AI temporarily unavailable."); }
                  setAiLoading(false);
                }}
                onMouseEnter={e=>e.currentTarget.style.boxShadow=T.shadowHover}
                onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
                <div style={{ fontSize:28, marginBottom:10 }}>{tool.icon}</div>
                <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>{tool.title}</div>
                <div style={{ fontSize:12, color:textSec, lineHeight:1.5 }}>{tool.desc}</div>
              </div>
            ))}
          </div>

          {aiSuggestion && (
            <div style={{ background:surface, borderRadius:T.r16, padding:"20px 22px", border:`1.5px solid ${T.green}44` }}>
              <div style={{ fontWeight:700, fontSize:14, color:T.green, marginBottom:10 }}>✦ AI Response</div>
              <div style={{ fontSize:13, color:text, lineHeight:1.8, whiteSpace:"pre-wrap" }}>{aiSuggestion}</div>
              <button onClick={()=>setAiSuggestion("")} style={{ marginTop:12, background:"none", border:`1px solid ${border}`, borderRadius:T.r8, padding:"5px 12px", cursor:"pointer", fontSize:12, color:textSec }}>Dismiss</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── POST JOB MODAL ───────────────────────────────────────────────────────────
function PostJobModal({ onClose, onPost }) {
  const [form, setForm] = useState({ title:"", company:"", location:"Addis Ababa", type:"Full-time", category:"Technology", salary_min:"", salary_max:"", description:"", skills:"", is_remote:false, is_featured:false });
  const { show } = useToast();
  const set = k => e => setForm(f=>({...f,[k]:e.target.value}));
  const inp = { width:"100%", padding:"10px 12px", borderRadius:T.r8, border:`1.5px solid ${T.grayLight}`, fontSize:13, outline:"none", boxSizing:"border-box", fontFamily:T.fontSans };

  return (
    <Modal onClose={onClose} maxWidth={560} title="Post a Job">
      <div style={{ padding:24, display:"flex", flexDirection:"column", gap:14 }}>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <div style={{ gridColumn:"1/-1" }}><label style={{ fontSize:12, fontWeight:600, display:"block", marginBottom:5 }}>Job Title *</label><input style={inp} placeholder="e.g. Senior Software Engineer" value={form.title} onChange={set("title")}/></div>
          <div><label style={{ fontSize:12, fontWeight:600, display:"block", marginBottom:5 }}>Company Name *</label><input style={inp} placeholder="Your company" value={form.company} onChange={set("company")}/></div>
          <div><label style={{ fontSize:12, fontWeight:600, display:"block", marginBottom:5 }}>Location</label><input style={inp} placeholder="Addis Ababa" value={form.location} onChange={set("location")}/></div>
          <div><label style={{ fontSize:12, fontWeight:600, display:"block", marginBottom:5 }}>Job Type</label>
            <select style={{...inp,appearance:"none"}} value={form.type} onChange={set("type")}>{["Full-time","Part-time","Contract","Freelance","Internship"].map(t=><option key={t}>{t}</option>)}</select></div>
          <div><label style={{ fontSize:12, fontWeight:600, display:"block", marginBottom:5 }}>Category</label>
            <select style={{...inp,appearance:"none"}} value={form.category} onChange={set("category")}>{CATEGORIES.map(c=><option key={c.name}>{c.name}</option>)}</select></div>
          <div><label style={{ fontSize:12, fontWeight:600, display:"block", marginBottom:5 }}>Min Salary (ETB)</label><input style={inp} type="number" placeholder="30000" value={form.salary_min} onChange={set("salary_min")}/></div>
          <div><label style={{ fontSize:12, fontWeight:600, display:"block", marginBottom:5 }}>Max Salary (ETB)</label><input style={inp} type="number" placeholder="50000" value={form.salary_max} onChange={set("salary_max")}/></div>
          <div style={{ gridColumn:"1/-1" }}><label style={{ fontSize:12, fontWeight:600, display:"block", marginBottom:5 }}>Job Description *</label><textarea style={{...inp,minHeight:100,resize:"vertical"}} placeholder="Describe the role, responsibilities, and requirements…" value={form.description} onChange={set("description")}/></div>
          <div style={{ gridColumn:"1/-1" }}><label style={{ fontSize:12, fontWeight:600, display:"block", marginBottom:5 }}>Required Skills (comma-separated)</label><input style={inp} placeholder="React, Node.js, PostgreSQL" value={form.skills} onChange={set("skills")}/></div>
          <div style={{ display:"flex", gap:20 }}>
            <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:13 }}><input type="checkbox" checked={form.is_remote} onChange={e=>setForm(f=>({...f,is_remote:e.target.checked}))}/> Remote OK</label>
            <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:13 }}><input type="checkbox" checked={form.is_featured} onChange={e=>setForm(f=>({...f,is_featured:e.target.checked}))}/> Feature this job (+ETB 500)</label>
          </div>
        </div>
        <button onClick={()=>{ if(!form.title||!form.company||!form.description) return show("Fill in required fields","error"); onPost(form); }}
          style={{ background:`linear-gradient(135deg,${T.green},${T.greenDark})`, color:"#fff", border:"none", borderRadius:T.r10, padding:"13px", fontWeight:800, fontSize:14, cursor:"pointer" }}>
          Post Job →
        </button>
      </div>
    </Modal>
  );
}

}

          <span>✦</span><span>AI</span>

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function EthioJobsConnect() {
  // Theme & UI state
  const [darkMode, setDarkMode]       = useLocalStorage("etj_dark", false);
  const [sidebarOpen, setSidebarOpen] = useLocalStorage("etj_sidebar", true);
  const [lang, setLang]               = useLocalStorage("etj_lang", "EN");

  // Auth state
  const [user, setUser]               = useState(null);
  const [authLoading, setAuthLoading] = useState(true);

  // Navigation
  const [activeNav, setActiveNav]     = useState("dashboard");
  const [searchQuery, setSearchQuery] = useState("");
  const debouncedSearch               = useDebounce(searchQuery, 280);

  // Job state
  const [savedJobs, setSavedJobs]     = useLocalStorage("etj_saved", []);
  const [filterCat, setFilterCat]     = useState("All");
  const [filterType, setFilterType]   = useState("All");
  const [selectedJob, setSelectedJob] = useState(null);
  const [applyJob, setApplyJob]       = useState(null);

  // Payment / subscription
  const [transactions, setTransactions] = useLocalStorage("etj_tx", []);
  const [activePlan, setActivePlan]     = useState(null);
  const [payPlan, setPayPlan]           = useState(null);

  // Modals
  const [showAuth, setShowAuth]   = useState(null);
  const [showAIChat, setShowAIChat] = useState(false);

  // Restore Supabase session on load
  useEffect(() => {
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        const u = session.user;
        setUser({ id:u.id, name:u.user_metadata?.full_name||"User", email:u.email, role:u.user_metadata?.role||"seeker" });
      }
      setAuthLoading(false);
    });
    const { data: { subscription } } = supabase.auth.onAuthStateChange((ev, session) => {
      if (ev==="SIGNED_IN" && session?.user) {
        const u = session.user;
        setUser({ id:u.id, name:u.user_metadata?.full_name||"User", email:u.email, role:u.user_metadata?.role||"seeker" });
      } else if (ev==="SIGNED_OUT") {
        setUser(null);
      }
    });
    return () => subscription?.unsubscribe();
  }, []);

  // Keyboard shortcut: K for search
  useEffect(() => {
    const h = e => { if ((e.metaKey||e.ctrlKey) && e.key==="k") { e.preventDefault(); document.querySelector("input[placeholder*='Search']")?.focus(); } };
    document.addEventListener("keydown", h);
    return () => document.removeEventListener("keydown", h);
  }, []);

  const filteredJobs = useMemo(() => DEMO_JOBS.filter(j =>
    (filterCat==="All" || j.category===filterCat) &&
    (filterType==="All" || j.type===filterType) &&
    (debouncedSearch==="" || j.title.toLowerCase().includes(debouncedSearch.toLowerCase()) || j.company.toLowerCase().includes(debouncedSearch.toLowerCase()) || j.category.toLowerCase().includes(debouncedSearch.toLowerCase()))
  ), [filterCat, filterType, debouncedSearch]);

  const { slice: jobsPage, page, total: totalPages, setPage, hasNext, hasPrev } = usePagination(filteredJobs, 6);

  const handleSaveJob = useCallback(id => {
    setSavedJobs(s => s.includes(id) ? s.filter(x=>x!==id) : [...s,id]);
  }, [setSavedJobs]);

  const handleNav = useCallback(id => {
    if (!user && ["applications","ai","cv","payments","profile","employer","admin"].includes(id)) {
      setShowAuth("login"); return;
    }
    setActiveNav(id);
    setSearchQuery("");
  }, [user]);

  const handleAuth = useCallback(u => setUser(u), []);
  const handleSignOut = useCallback(async () => {
    await supabase.auth.signOut();
    setUser(null);
    setActiveNav("dashboard");
  }, []);

  const handlePaySuccess = useCallback(rec => {
    setTransactions(t => [rec, ...t]);
    setActivePlan(rec.plan);
  }, [setTransactions]);

  // Theme tokens passed down
  const themeVal = useMemo(() => ({ dark: darkMode }), [darkMode]);
  const th = {
    bg:         darkMode ? "#0D1B2A"    : T.offWhite,
    surface:    darkMode ? T.navyLight  : "#fff",
    border:     darkMode ? "rgba(255,255,255,0.08)" : T.grayLight,
    text:       darkMode ? T.white      : T.navy,
    textSec:    darkMode ? T.gray       : T.gray,
  };

  if (authLoading) {
    return (
      <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:th.bg, fontFamily:T.fontSans }}>
        <div style={{ textAlign:"center" }}>
          <div style={{ width:48, height:48, borderRadius:T.r12, background:`linear-gradient(135deg,${T.green},${T.yellow})`, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:900, color:T.navy, fontSize:18, margin:"0 auto 16px" }}>EJ</div>
          <Spinner size={28}/>
          <div style={{ marginTop:12, color:th.textSec, fontSize:14 }}>Loading EthioJobs Connect…</div>
        </div>
      </div>
    );
  }

  return (
    <ThemeCtx.Provider value={themeVal}>
      <ToastProvider>
        <div style={{ fontFamily:T.fontSans, background:th.bg, minHeight:"100vh", display:"flex", color:th.text, transition:"background 0.25s" }}>

          {/* Sidebar */}
          <Sidebar
            activeNav={activeNav} onNav={handleNav} user={user}
            onAuth={setShowAuth} onSignOut={handleSignOut}
            open={sidebarOpen} onToggle={()=>setSidebarOpen(s=>!s)}
            darkMode={darkMode}
          />

          {/* Main */}
          <div style={{ flex:1, display:"flex", flexDirection:"column", minWidth:0 }}>
            <TopBar
              user={user} darkMode={darkMode} onDarkMode={()=>setDarkMode(d=>!d)}
              onAuth={setShowAuth} onNav={handleNav} onAIChat={()=>setShowAIChat(true)}
              searchQuery={searchQuery} onSearch={setSearchQuery}
              activePlan={activePlan} lang={lang} onLang={setLang}
            />

            {/* Page Content */}
            <div style={{ flex:1, padding:"20px 22px", overflowY:"auto", maxWidth:1200 }}>

              {/* ── DASHBOARD */}
              {activeNav==="dashboard" && (
                <>
                  {user?.role==="admin"    && <AdminDashboard/>}
                  {user?.role==="employer" && <EmployerDashboard user={user} onNav={handleNav}/>}
                  {(!user || user?.role==="seeker") && <SeekerDashboard user={user} onNav={handleNav}/>}
                </>
              )}

              {/* ── EMPLOYER (direct nav) */}
              {activeNav==="employer" && <EmployerDashboard user={user} onNav={handleNav}/>}

              {/* ── ADMIN (direct nav) */}
              {activeNav==="admin" && <AdminDashboard/>}

              {/* ── JOBS */}
              {activeNav==="jobs" && (
                <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
                  {/* Header + Filters */}
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:12 }}>
                    <div>
                      <h2 style={{ margin:"0 0 2px", fontSize:22, fontWeight:800 }}>Find Jobs</h2>
                      <div style={{ fontSize:13, color:th.textSec }}>{filteredJobs.length.toLocaleString()} positions found</div>
                    </div>
                    <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                      <select value={filterType} onChange={e=>setFilterType(e.target.value)} style={{ padding:"8px 12px", borderRadius:T.r8, border:`1.5px solid ${th.border}`, background:th.surface, color:th.text, fontSize:13, outline:"none", cursor:"pointer" }}>
                        {["All","Full-time","Part-time","Contract","Freelance","Internship"].map(t=><option key={t}>{t}</option>)}
                      </select>
                    </div>
                  </div>

                  {/* Categories */}
                  <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:4 }}>
                    {["All",...CATEGORIES.map(c=>c.name)].map(cat=>(
                      <button key={cat} onClick={()=>setFilterCat(cat)} style={{ padding:"6px 14px", borderRadius:20, border:`1.5px solid ${filterCat===cat?T.green:th.border}`, background:filterCat===cat?T.green:"none", color:filterCat===cat?"#fff":th.textSec, fontWeight:filterCat===cat?700:400, cursor:"pointer", fontSize:12, whiteSpace:"nowrap", transition:"all 0.2s" }}>{cat}</button>
                    ))}
                  </div>

                  {/* Job Grid */}
                  {filteredJobs.length === 0 ? (
                    <div style={{ background:th.surface, borderRadius:T.r16, padding:48, textAlign:"center", border:`1px solid ${th.border}` }}>
                      <div style={{ fontSize:40, marginBottom:12 }}>🔍</div>
                      <div style={{ fontWeight:700, fontSize:16, marginBottom:6 }}>No jobs found</div>
                      <div style={{ color:th.textSec, fontSize:14 }}>Try different keywords or clear your filters</div>
                      <button onClick={()=>{ setSearchQuery(""); setFilterCat("All"); }} style={{ marginTop:16, background:T.green, color:"#fff", border:"none", borderRadius:T.r10, padding:"9px 20px", cursor:"pointer", fontWeight:700 }}>Clear filters</button>
                    </div>
                  ) : (
                    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))", gap:14 }}>
                      {jobsPage.map(job=>(
                        <JobCard key={job.id} job={job} saved={savedJobs.includes(job.id)} onSave={handleSaveJob}
                          onApply={j=>setApplyJob(j)} onView={()=>setSelectedJob(job)}/>
                      ))}
                    </div>
                  )}

                  {/* Pagination */}
                  {totalPages > 1 && (
                    <div style={{ display:"flex", gap:6, justifyContent:"center", alignItems:"center" }}>
                      <button onClick={()=>setPage(p=>p-1)} disabled={!hasPrev} style={{ background:th.surface, border:`1.5px solid ${th.border}`, borderRadius:T.r8, padding:"7px 14px", cursor:hasPrev?"pointer":"not-allowed", opacity:hasPrev?1:0.4, fontWeight:700 }}>← Prev</button>
                      {Array.from({length:totalPages},(_,i)=>(
                        <button key={i} onClick={()=>setPage(i+1)} style={{ background:page===i+1?T.green:th.surface, border:`1.5px solid ${page===i+1?T.green:th.border}`, borderRadius:T.r8, padding:"7px 12px", cursor:"pointer", fontWeight:700, color:page===i+1?"#fff":th.text, minWidth:36 }}>{i+1}</button>
                      ))}
                      <button onClick={()=>setPage(p=>p+1)} disabled={!hasNext} style={{ background:th.surface, border:`1.5px solid ${th.border}`, borderRadius:T.r8, padding:"7px 14px", cursor:hasNext?"pointer":"not-allowed", opacity:hasNext?1:0.4, fontWeight:700 }}>Next →</button>
                    </div>
                  )}
                </div>
              )}

              {/* ── APPLICATIONS */}
              {activeNav==="applications" && (
                <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <h2 style={{ margin:0, fontSize:22, fontWeight:800 }}>My Applications</h2>
                    <Badge label={`${[...Object.values(STATUS_META)].length} statuses`} color={T.green}/>
                  </div>
                  {/* Stats */}
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))", gap:10 }}>
                    {Object.entries(STATUS_META).map(([status,meta])=>(
                      <div key={status} style={{ background:th.surface, borderRadius:T.r12, padding:"12px 14px", border:`1px solid ${th.border}`, textAlign:"center" }}>
                        <div style={{ fontSize:18 }}>{meta.icon}</div>
                        <div style={{ fontWeight:800, fontSize:16, color:meta.text }}>
                          {status==="Pending"?3:status==="Interview"?1:status==="Shortlisted"?1:0}
                        </div>
                        <div style={{ fontSize:11, color:th.textSec, marginTop:2 }}>{status}</div>
                      </div>
                    ))}
                  </div>
                  {/* Applications list */}
                  <div style={{ background:th.surface, borderRadius:T.r16, border:`1px solid ${th.border}`, overflow:"hidden" }}>

                      { company:"Ethio Telecom",      role:"Marketing Manager",        status:"Shortlisted",date:"Jun 18", logo:"ET", color:T.red },

                      { company:"Ride Ethiopia",      role:"UX/UI Designer",           status:"Viewed",     date:"Jun 12", logo:"RE", color:T.green },
                      { company:"CRBC Ethiopia",      role:"Civil Engineer",           status:"Rejected",   date:"Jun 10", logo:"CR", color:T.navy, note:"Thank you for applying. We'll keep your profile." },
                    ].map((a,i,arr)=>{
                      const s = STATUS_META[a.status]||STATUS_META.Pending;
                      return (

                            <div style={{ width:44, height:44, borderRadius:T.r12, background:a.color, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:14, flexShrink:0 }}>{a.logo}</div>
                            <div style={{ flex:1, minWidth:160 }}>
                              <div style={{ fontWeight:700, fontSize:14 }}>{a.role}</div>
                              <div style={{ color:th.textSec, fontSize:12, marginTop:2 }}>{a.company} · Applied {a.date}</div>

                            <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>

                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* ── AI TOOLS */}
              {activeNav==="ai" && (
                <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
                  <div>
                    <h2 style={{ margin:"0 0 4px", fontSize:22, fontWeight:800 }}>AI Career Tools</h2>
                    <div style={{ fontSize:13, color:th.textSec }}>Powered by Claude — your personal career intelligence engine</div>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))", gap:14 }}>
                    {[
                      { icon:"📄", title:"CV Review & ATS Score", desc:"Upload your CV for instant AI feedback and applicant tracking system compatibility score.", color:T.green, action:()=>handleNav("cv") },
                      { icon:"✉️", title:"Cover Letter Generator", desc:"Generate a tailored, professional cover letter for any job in seconds.", color:T.navyMid, action:()=>{ setShowAIChat(true); } },

                        <div style={{ fontSize:13, color:th.textSec, lineHeight:1.6 }}>{tool.desc}</div>

                    <div>
                      <div style={{ fontWeight:800, fontSize:18, marginBottom:4 }}>✦ Chat with EthioJobs AI</div>

                    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))", gap:14 }}>
                      {DEMO_JOBS.filter(j=>savedJobs.includes(j.id)).map(job=>(
                        <JobCard key={job.id} job={job} saved={true} onSave={handleSaveJob} onApply={j=>setApplyJob(j)} onView={()=>setSelectedJob(job)}/>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* ── PRICING */}
              {activeNav==="pricing" && <PricingPage onBuy={p=>setPayPlan(p)}/>}

              {/* ── PAYMENTS */}
              {activeNav==="payments" && (
                <div style={{ display:"flex", flexDirection:"column", gap:20, maxWidth:800 }}>
                  <h2 style={{ margin:0, fontSize:22, fontWeight:800 }}>My Payments & Subscription</h2>

                  {activePlan ? (
                    <div style={{ background:`linear-gradient(135deg,${T.green},${T.greenDark})`, borderRadius:T.r16, padding:"22px 26px", color:"#fff" }}>
                      <div style={{ fontSize:11, color:"rgba(255,255,255,0.7)", fontWeight:700, letterSpacing:2, marginBottom:4 }}>ACTIVE PLAN</div>
                      <div style={{ fontWeight:900, fontSize:22, marginBottom:12 }}>{activePlan}</div>
                      <div style={{ display:"flex", gap:24, flexWrap:"wrap" }}>
                        <div><div style={{ fontSize:11, color:"rgba(255,255,255,0.6)" }}>Status</div><div style={{ fontWeight:700 }}>⏳ Pending Verification</div></div>
                        <div><div style={{ fontSize:11, color:"rgba(255,255,255,0.6)" }}>Method</div><div style={{ fontWeight:700 }}>{transactions[0]?.method?.toUpperCase()||"—"}</div></div>
                        <div><div style={{ fontSize:11, color:"rgba(255,255,255,0.6)" }}>Submitted</div><div style={{ fontWeight:700 }}>{transactions[0]?fmtDate(transactions[0].date):"—"}</div></div>
                      </div>
                    </div>
                  ) : (
                    <div style={{ background:th.surface, borderRadius:T.r16, padding:32, border:`2px dashed ${th.border}`, textAlign:"center" }}>
                      <div style={{ fontSize:40, marginBottom:12 }}>💳</div>
                      <div style={{ fontWeight:700, fontSize:16, marginBottom:6 }}>No active subscription</div>
                      <div style={{ color:th.textSec, fontSize:14, marginBottom:16 }}>Upgrade to access premium features</div>
                      <button onClick={()=>handleNav("pricing")} style={{ background:T.green, color:"#fff", border:"none", borderRadius:T.r10, padding:"10px 24px", cursor:"pointer", fontWeight:700 }}>View Plans →</button>
                    </div>
                  )}

                  {transactions.length > 0 && (
                    <div style={{ background:th.surface, borderRadius:T.r16, border:`1px solid ${th.border}`, overflow:"hidden" }}>
                      <div style={{ padding:"16px 20px", borderBottom:`1px solid ${th.border}`, fontWeight:700, fontSize:15 }}>Transaction History</div>
                      <div style={{ overflowX:"auto" }}>
                        <table style={{ width:"100%", borderCollapse:"collapse" }}>
                          <thead><tr style={{ background:th.bg }}>{["Reference","Plan","Amount","Method","Date","Status"].map(h=><th key={h} style={{ padding:"10px 16px", textAlign:"left", fontSize:11, color:th.textSec, fontWeight:700, whiteSpace:"nowrap" }}>{h}</th>)}</tr></thead>
                          <tbody>
                            {transactions.map((tx,i)=>(
                              <tr key={i} style={{ borderTop:`1px solid ${th.border}` }}>
                                <td style={{ padding:"12px 16px", fontSize:11, fontFamily:"monospace", color:T.navy, whiteSpace:"nowrap" }}>{tx.txRef}</td>
                                <td style={{ padding:"12px 16px", fontSize:13 }}>{tx.plan}</td>
                                <td style={{ padding:"12px 16px", fontSize:13, fontWeight:700, color:T.green, whiteSpace:"nowrap" }}>{fmtCurrency(tx.amount)}</td>
                                <td style={{ padding:"12px 16px" }}><Badge label={tx.method?.toUpperCase()} color={tx.method==="cbe"?T.cbe:tx.method==="telebirr"?T.telebirr:T.chapa}/></td>
                                <td style={{ padding:"12px 16px", fontSize:12, color:th.textSec, whiteSpace:"nowrap" }}>{fmtDate(tx.date)}</td>
                                <td style={{ padding:"12px 16px" }}><Badge label={tx.status} color={T.gold}/></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* How it works */}
                  <div style={{ background:th.surface, borderRadius:T.r16, padding:"20px 24px", border:`1px solid ${th.border}` }}>
                    <div style={{ fontWeight:700, fontSize:15, marginBottom:16 }}>How Payment Verification Works</div>
                    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))", gap:16 }}>
                      {[["1","💳","Select a Plan","Pick the plan that fits your needs"],["2","🏦","Send Payment","Transfer via Telebirr, CBE, or Chapa"],["3","📋","Submit Details","Enter your name and transaction ID"],["4","✅","Get Activated","We verify within 30 minutes"]].map(([n,ic,t,d])=>(
                        <div key={n} style={{ display:"flex", gap:12, alignItems:"flex-start" }}>
                          <div style={{ width:30, height:30, borderRadius:"50%", background:T.greenLight, color:T.green, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:13, flexShrink:0 }}>{n}</div>
                          <div><div style={{ fontWeight:700, fontSize:13 }}>{t}</div><div style={{ color:th.textSec, fontSize:12, marginTop:2 }}>{d}</div></div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* ── PROFILE */}
              {activeNav==="profile" && (
                <div style={{ display:"flex", flexDirection:"column", gap:20, maxWidth:720 }}>
                  <h2 style={{ margin:0, fontSize:22, fontWeight:800 }}>My Profile</h2>
                  <div style={{ background:th.surface, borderRadius:T.r16, border:`1px solid ${th.border}`, overflow:"hidden" }}>
                    <div style={{ height:100, background:`linear-gradient(135deg,${T.green},${T.navyMid})` }}/>
                    <div style={{ padding:"0 24px 24px", marginTop:-40 }}>
                      <Avatar name={user?.name||"Guest"} size={76}/>
                      <h3 style={{ margin:"12px 0 2px", fontSize:20, fontWeight:800 }}>{user?.name || "Guest User"}</h3>
                      <div style={{ color:T.green, fontWeight:700, fontSize:14, marginBottom:2 }}>Senior Software Engineer</div>
                      <div style={{ color:th.textSec, fontSize:13 }}>📍 Addis Ababa, Ethiopia · 🟢 Open to work</div>
                      <div style={{ marginTop:10, display:"flex", gap:8 }}>
                        <Badge label={user?.role?.toUpperCase()||"SEEKER"} color={user?.role==="admin"?T.red:user?.role==="employer"?T.navy:T.green}/>
                        {activePlan && <Badge label={activePlan} color={T.gold}/>}
                      </div>
                    </div>
                  </div>
                  {[
                    { label:"Account Details", fields:[["Full Name",user?.name||"—"],["Email",user?.email||"—"],["Role",user?.role||"seeker"],["Phone","+251 911 234 567"],["City","Addis Ababa"]] },
                    { label:"Skills", fields:[["Technical","React, Node.js, Python, PostgreSQL, Docker"],["Soft Skills","Leadership, Communication, Problem Solving"]] },
                    { label:"Languages", fields:[["Amharic","Native"],["English","Fluent"],["Afaan Oromo","Conversational"]] },
                  ].map(section=>(
                    <div key={section.label} style={{ background:th.surface, borderRadius:T.r16, padding:"20px 24px", border:`1px solid ${th.border}` }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
                        <div style={{ fontWeight:700, fontSize:15 }}>{section.label}</div>
                        <button style={{ background:"none", border:`1px solid ${th.border}`, borderRadius:T.r8, padding:"5px 12px", cursor:"pointer", fontSize:12, color:th.textSec }}>Edit</button>
                      </div>
                      {section.fields.map(([k,v])=>(
                        <div key={k} style={{ display:"flex", gap:16, marginBottom:10 }}>
                          <div style={{ color:th.textSec, fontSize:13, minWidth:100 }}>{k}</div>
                          <div style={{ fontSize:13, fontWeight:500 }}>{v}</div>
                        </div>
                      ))}
                    </div>
                  ))}
                  <button onClick={handleSignOut} style={{ background:T.redLight, color:T.red, border:`1px solid ${T.red}44`, borderRadius:T.r10, padding:"11px", cursor:"pointer", fontWeight:700, fontSize:14 }}>Sign Out</button>
                </div>
              )}

            </div>
          </div>

          {/* ── MODALS */}
          {showAIChat  && <AIChat onClose={()=>setShowAIChat(false)} user={user}/>}
          {payPlan     && <PaymentModal plan={payPlan} onClose={()=>setPayPlan(null)} onSuccess={rec=>{ handlePaySuccess(rec); setPayPlan(null); handleNav("payments"); }}/>}
          {showAuth    && <AuthModal mode={showAuth} onClose={()=>setShowAuth(null)} onAuth={u=>{ handleAuth(u); setShowAuth(null); }}/>}
          {selectedJob && <JobDetailModal job={selectedJob} onClose={()=>setSelectedJob(null)} onApply={j=>{ setApplyJob(j); setSelectedJob(null); }} saved={savedJobs.includes(selectedJob?.id)} onSave={handleSaveJob}/>}
          {applyJob    && <ApplyModal job={applyJob} onClose={()=>setApplyJob(null)} user={user}/>}

        </div>

        {/* Global CSS */}
        <style>{`
          @keyframes spin { to { transform: rotate(360deg); } }
          @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
          @keyframes slideIn { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }
          * { box-sizing: border-box; }
          ::-webkit-scrollbar { width: 5px; height: 5px; }
          ::-webkit-scrollbar-track { background: transparent; }
          ::-webkit-scrollbar-thumb { background: #C5CDD9; border-radius: 99px; }
          ::-webkit-scrollbar-thumb:hover { background: #8892A4; }
          input, textarea, select, button { font-family: inherit; }
          @media (max-width: 600px) {
            div[style*="padding: 20px 22px"] { padding: 12px !important; }
          }
        `}</style>
      </ToastProvider>
    </ThemeCtx.Provider>
  );
}


const _root = createRoot(document.getElementById('root'));
_root.render(<EthioJobsConnect />);
// Hide loader after first render
setTimeout(() => {
  const loader = document.getElementById('loading');
  if (loader) loader.style.display = 'none';
}, 500);
</script>
</body>
</html>
